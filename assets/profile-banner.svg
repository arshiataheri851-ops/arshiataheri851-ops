<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
  <title id="title">Arshia Taheri — AI and ML Engineering</title>
  <desc id="desc">Abstract dark navy technology banner with connected nodes and the title AI, ML, and Backend Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".55" stop-color="#101d38"/>
      <stop offset="1" stop-color="#142b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49d6c8"/>
      <stop offset="1" stop-color="#6d8cff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9bb8de" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1500" height="420" fill="url(#bg)"/>
  <rect width="1500" height="420" fill="url(#grid)"/>
  <circle cx="1250" cy="120" r="230" fill="#4779d4" opacity=".10"/>
  <circle cx="1350" cy="340" r="190" fill="#35c7bb" opacity=".08"/>
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity=".62">
    <path d="M980 80L1110 150L1240 85L1370 160L1290 280L1430 340"/>
    <path d="M1110 150L1100 300L1290 280L1370 160"/>
    <path d="M980 80L960 240L1100 300"/>
    <path d="M1240 85L1290 280"/>
  </g>
  <g fill="#62e0d0" filter="url(#glow)">
    <circle cx="980" cy="80" r="6"/><circle cx="1110" cy="150" r="7"/><circle cx="1240" cy="85" r="5"/>
    <circle cx="1370" cy="160" r="7"/><circle cx="1290" cy="280" r="6"/><circle cx="1430" cy="340" r="5"/>
    <circle cx="1100" cy="300" r="5"/><circle cx="960" cy="240" r="4"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="105" y="145" fill="#a7c2e8" font-size="19" letter-spacing="5">ENGINEERING PORTFOLIO</text>
    <text x="100" y="225" fill="#ffffff" font-size="64" font-weight="700">ARSHIA TAHERI</text>
    <rect x="105" y="258" width="90" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="105" y="316" fill="#c2d2e8" font-size="26">AI / ML  ·  LLM APPLICATIONS  ·  BACKEND SYSTEMS</text>
  </g>
</svg>