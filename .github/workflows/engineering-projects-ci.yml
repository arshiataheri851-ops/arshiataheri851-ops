name: Engineering Projects CI

on:
  push:
    branches: [main, master]
    paths:
      - "projects/persian-sentiment-api/**"
      - "projects/production-rag-service/**"
      - "projects/webhook-reliability-platform/**"
      - ".github/workflows/engineering-projects-ci.yml"
  pull_request:
    paths:
      - "projects/persian-sentiment-api/**"
      - "projects/production-rag-service/**"
      - "projects/webhook-reliability-platform/**"
      - ".github/workflows/engineering-projects-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-projects-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.project.name }} · Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        project:
          - name: FarsiPulse
            path: projects/persian-sentiment-api
            install: editable
          - name: AtlasRAG
            path: projects/production-rag-service
            install: requirements
          - name: RelayForge
            path: projects/webhook-reliability-platform
            install: requirements

    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.project.path }}/pyproject.toml
            ${{ matrix.project.path }}/requirements-dev.txt
            ${{ matrix.project.path }}/requirements.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install FarsiPulse test dependencies
        if: matrix.project.install == 'editable'
        run: python -m pip install -e ".[dev]"

      - name: Install API test dependencies
        if: matrix.project.install == 'requirements'
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and API tests
        run: python -m pytest

      - name: Run Ruff static checks
        run: |
          python -m pip install "ruff>=0.6,<1.0"
          ruff check app tests
