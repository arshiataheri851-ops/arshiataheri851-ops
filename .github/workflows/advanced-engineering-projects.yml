name: Advanced engineering project checks

on:
  push:
    paths:
      - "projects/workflow-orchestration-engine/**"
      - "projects/webhook-reliability-platform/**"
      - "projects/ml-feature-store/**"
      - "projects/llm-gateway-control-plane/**"
      - ".github/workflows/advanced-engineering-projects.yml"
  pull_request:
    paths:
      - "projects/workflow-orchestration-engine/**"
      - "projects/webhook-reliability-platform/**"
      - "projects/ml-feature-store/**"
      - ".github/workflows/advanced-engineering-projects.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - workflow-orchestration-engine
          - webhook-reliability-platform
          - ml-feature-store
          - llm-gateway-control-plane
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff checks
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
