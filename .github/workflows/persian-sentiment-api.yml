name: Persian Sentiment API CI

on:
  push:
    paths:
      - "projects/persian-sentiment-api/**"
      - ".github/workflows/persian-sentiment-api.yml"
  pull_request:
    paths:
      - "projects/persian-sentiment-api/**"
      - ".github/workflows/persian-sentiment-api.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/persian-sentiment-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/persian-sentiment-api/pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
