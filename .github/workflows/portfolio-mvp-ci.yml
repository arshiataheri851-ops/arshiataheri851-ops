name: Portfolio and MVP Project CI

on:
  push:
    branches: [main, master]
    paths:
      - "projects/routepilot/**"
      - "projects/signaldesk/**"
      - "projects/eryndex-company-website/**"
      - ".github/workflows/portfolio-mvp-ci.yml"
  pull_request:
    paths:
      - "projects/routepilot/**"
      - "projects/signaldesk/**"
      - "projects/eryndex-company-website/**"
      - ".github/workflows/portfolio-mvp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-mvp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: "${{ matrix.project.name }} API tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: RoutePilot
            path: projects/routepilot/backend
            requirements_file: requirements.txt
            database_env: ROUTEPILOT_DB
            database_file: routepilot-ci.sqlite3
          - name: SignalDesk
            path: projects/signaldesk/backend
            requirements_file: requirements.txt
            database_env: SIGNALDESK_DB
            database_file: signaldesk-ci.sqlite3
          - name: Grounded Document Retrieval
            path: projects/grounded-document-retrieval
            requirements_file: requirements-dev.txt
          - name: Market Intelligence Risk Engine
            path: projects/market-intelligence-risk-engine
            requirements_file: requirements-dev.txt
          - name: ML Model Serving Platform
            path: projects/ml-model-serving-platform
            requirements_file: requirements-dev.txt
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project.path }}/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r ${{ matrix.project.requirements_file }}
      - name: Configure isolated test database
        if: matrix.project.database_env != ''
        run: echo "${{ matrix.project.database_env }}=${RUNNER_TEMP}/${{ matrix.project.database_file }}" >> "$GITHUB_ENV"
      - name: Run project regression tests
        run: python -m pytest -q

  website-checks:
    name: ERYNDEX static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        working-directory: projects/eryndex-company-website
        run: |
          node --check assets/config.js
          node --check assets/script.js
          node --check contact-api/worker.js
      - name: Check local HTML links, assets and anchors
        working-directory: projects/eryndex-company-website
        run: python tests/check_site.py
