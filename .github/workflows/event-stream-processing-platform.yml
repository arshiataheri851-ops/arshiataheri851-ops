name: Event Stream Processing Platform CI

on:
  push:
    paths:
      - 'projects/event-stream-processing-platform/**'
      - '.github/workflows/event-stream-processing-platform.yml'
  pull_request:
    paths:
      - 'projects/event-stream-processing-platform/**'
      - '.github/workflows/event-stream-processing-platform.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/event-stream-processing-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/event-stream-processing-platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
