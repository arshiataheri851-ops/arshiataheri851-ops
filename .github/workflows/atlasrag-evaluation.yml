name: AtlasRAG Large-Corpus Evaluation

on:
  pull_request:
    paths:
      - "projects/production-rag-service/**"
      - ".github/workflows/atlasrag-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "projects/production-rag-service/**"
      - ".github/workflows/atlasrag-evaluation.yml"
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/production-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/production-rag-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q
      - name: Run 1,000-document retrieval benchmark
        run: python scripts/benchmark_retrieval.py --documents 1000 --queries 100 --output reports/atlasrag-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlasrag-large-corpus-report
          path: projects/production-rag-service/reports/atlasrag-benchmark.json
          if-no-files-found: error
