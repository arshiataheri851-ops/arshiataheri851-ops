name: AtlasRAG Large-Corpus Evaluation

on:
  pull_request:
    paths:
      - "projects/production-rag-service/**"
      - "compose.yaml"
      - ".github/workflows/atlasrag-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "projects/production-rag-service/**"
      - "compose.yaml"
      - ".github/workflows/atlasrag-evaluation.yml"
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlasrag_test
          POSTGRES_USER: atlasrag
          POSTGRES_PASSWORD: atlasrag-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasrag -d atlasrag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAG_TEST_DATABASE_URL: postgresql://atlasrag:atlasrag-ci-password@localhost:5432/atlasrag_test
    defaults:
      run:
        working-directory: projects/production-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/production-rag-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q
      - name: Run 1,000-document retrieval benchmark
        run: python scripts/benchmark_retrieval.py --documents 1000 --queries 100 --output reports/atlasrag-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlasrag-large-corpus-report
          path: projects/production-rag-service/reports/atlasrag-benchmark.json
          if-no-files-found: error

  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start AtlasRAG
        env:
          ATLASRAG_DB_PASSWORD: atlasrag-ci-compose-password
          ATLASRAG_TENANT_API_KEYS_JSON: '{"ci":"ci-only-atlasrag-tenant-key-0123456789"}'
        run: docker compose up --build -d atlasrag
      - name: Inspect container startup
        env:
          ATLASRAG_DB_PASSWORD: atlasrag-ci-compose-password
          ATLASRAG_TENANT_API_KEYS_JSON: '{"ci":"ci-only-atlasrag-tenant-key-0123456789"}'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 atlasrag-db atlasrag
      - name: Wait for healthy API
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          deadline = time.time() + 90
          last_error = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8002/health", timeout=3) as response:
                      payload = json.load(response)
                  if payload.get("status") == "ok":
                      print(payload)
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(3)
          else:
              raise SystemExit(f"AtlasRAG did not become healthy: {last_error}")
          PY
      - name: Exercise authenticated ingestion, retrieval, and citations
        env:
          ATLASRAG_API_KEY: ci-only-atlasrag-tenant-key-0123456789
        run: python projects/production-rag-service/scripts/smoke_test.py --base-url http://127.0.0.1:8002
      - name: Dump service logs on failure
        if: failure()
        env:
          ATLASRAG_DB_PASSWORD: atlasrag-ci-compose-password
          ATLASRAG_TENANT_API_KEYS_JSON: '{"ci":"ci-only-atlasrag-tenant-key-0123456789"}'
        run: docker compose logs --no-color atlasrag-db atlasrag

      - name: Stop demo stack
        if: always()
        env:
          ATLASRAG_DB_PASSWORD: atlasrag-ci-compose-password
          ATLASRAG_TENANT_API_KEYS_JSON: '{"ci":"ci-only-atlasrag-tenant-key-0123456789"}'
        run: docker compose down -v
