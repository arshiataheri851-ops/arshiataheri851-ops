name: Intelligent recommendation platform CI

on:
  push:
    paths:
      - "projects/intelligent-recommendation-platform/**"
      - ".github/workflows/intelligent-recommendation-platform.yml"
  pull_request:
    paths:
      - "projects/intelligent-recommendation-platform/**"
      - ".github/workflows/intelligent-recommendation-platform.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: projects/intelligent-recommendation-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/intelligent-recommendation-platform/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Preview recommendation import sorting
        run: python -m ruff check --select I001 --fix --diff app/recommender.py || true
      - name: Ruff checks
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
