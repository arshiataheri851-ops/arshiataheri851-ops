name: Production RAG Service CI
on:
  push:
    paths:
      - 'projects/production-rag-service/**'
      - '.github/workflows/production-rag-service.yml'
  pull_request:
    paths:
      - 'projects/production-rag-service/**'
      - '.github/workflows/production-rag-service.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: projects/production-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/production-rag-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
