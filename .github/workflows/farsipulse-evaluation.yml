name: FarsiPulse Model Evaluation

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Inference batch size (1-32)
        required: false
        default: "16"
  push:
    branches: [main]
    paths:
      - "projects/persian-sentiment-api/**"
      - ".github/workflows/farsipulse-evaluation.yml"
  pull_request:
    paths:
      - "projects/persian-sentiment-api/**"
      - ".github/workflows/farsipulse-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: farsipulse-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate pinned ParsBERT on fixed SnappFood test split
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/persian-sentiment-api
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PYTHONUNBUFFERED: "1"
      SENTIMENT_CPU_THREADS: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/persian-sentiment-api/pyproject.toml

      - name: Cache Hugging Face model and dataset files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: farsipulse-evaluation-${{ runner.os }}-model-8c5d0be5517c4bd5e26f785b1ad60b394a80de07-dataset-f7127a990026b685fcf3ff2086b74138ec1e9fa6

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"

      - name: Install evaluation dependencies
        run: python -m pip install -e ".[inference,evaluation,dev]"

      - name: Run reproducible evaluation
        env:
          EVALUATION_BATCH_SIZE: ${{ inputs.batch_size || '16' }}
        run: |
          mkdir -p artifacts
          python scripts/evaluate.py --batch-size "$EVALUATION_BATCH_SIZE" --output artifacts/report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: farsipulse-evaluation-report
          path: projects/persian-sentiment-api/artifacts/report.json
          if-no-files-found: error
          retention-days: 30
