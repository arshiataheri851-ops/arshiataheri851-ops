name: Agent Workflow Orchestrator CI
on:
  push:
    paths:
      - 'projects/agent-workflow-orchestrator/**'
      - '.github/workflows/agent-workflow-orchestrator.yml'
  pull_request:
    paths:
      - 'projects/agent-workflow-orchestrator/**'
      - '.github/workflows/agent-workflow-orchestrator.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/agent-workflow-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/agent-workflow-orchestrator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
