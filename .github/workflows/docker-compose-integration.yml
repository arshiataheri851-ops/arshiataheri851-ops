name: Docker Compose Integration

on:
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - "projects/persian-sentiment-api/**"
      - "projects/production-rag-service/**"
      - "projects/webhook-reliability-platform/**"
      - ".github/workflows/docker-compose-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-compose-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Build and start all three API services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --detach --build

      - name: Verify FarsiPulse API
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8001/health

      - name: Verify AtlasRAG API
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8002/health

      - name: Verify RelayForge API
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8003/health

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
