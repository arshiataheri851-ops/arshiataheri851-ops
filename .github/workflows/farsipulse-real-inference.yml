name: FarsiPulse Real Model Inference

on:
  push:
    branches: [main]
    paths:
      - "projects/persian-sentiment-api/**"
      - ".github/workflows/farsipulse-real-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farsipulse-real-inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model-inference:
    name: Download pinned ParsBERT and test real API inference
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects/persian-sentiment-api
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/persian-sentiment-api/pyproject.toml

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: farsipulse-parsbert-${{ runner.os }}-8c5d0be5517c4bd5e26f785b1ad60b394a80de07

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"

      - name: Install FarsiPulse with real inference dependencies
        run: python -m pip install -e ".[inference,dev]"

      - name: Download pinned ParsBERT weights and run single + batch API inference
        run: python scripts/smoke_real_inference.py
