projects:
  - name: nexora-platform
    environments:
      - name: production
        services:
          - type: web
            name: farsipulse-api
            runtime: docker
            plan: starter
            region: frankfurt
            dockerContext: ./projects/persian-sentiment-api
            dockerfilePath: ./projects/persian-sentiment-api/Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: SENTIMENT_API_KEY
                sync: false
              - key: SENTIMENT_REQUIRE_API_KEY
                value: "true"
              - key: SENTIMENT_INFERENCE_BATCH_SIZE
                value: "8"
              - key: SENTIMENT_CPU_THREADS
                value: "2"
              - key: SENTIMENT_MAX_SEQUENCE_LENGTH
                value: "512"
              - key: HF_HOME
                value: /home/app/.cache/huggingface
            disk:
              name: farsipulse-model-cache
              mountPath: /home/app/.cache/huggingface
              sizeGB: 5

          - type: web
            name: atlasrag-api
            runtime: docker
            plan: starter
            region: frankfurt
            dockerContext: ./projects/production-rag-service
            dockerfilePath: ./projects/production-rag-service/Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: RAG_DATABASE_URL
                fromDatabase:
                  name: atlasrag-postgres
                  property: connectionString
              - key: RAG_AUTH_REQUIRED
                value: "true"
              - key: RAG_TENANT_API_KEYS_JSON
                sync: false
              - key: RAG_METRICS_TOKEN
                sync: false

          - type: web
            name: relayforge-api
            runtime: docker
            plan: starter
            region: frankfurt
            dockerContext: ./projects/webhook-reliability-platform
            dockerfilePath: ./projects/webhook-reliability-platform/Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: RELAYFORGE_DATABASE_PATH
                value: /srv/app/data/relayforge.sqlite3
              - key: RELAYFORGE_API_TOKEN
                sync: false
              - key: RELAYFORGE_OPERATOR_TOKEN
                sync: false
              - key: RELAYFORGE_ALLOWED_HOSTS
                sync: false
              - key: RELAYFORGE_ENABLE_WORKER
                value: "false"
              - key: RELAYFORGE_MAX_ATTEMPTS
                value: "5"
              - key: RELAYFORGE_RETRY_BASE_DELAY_SECONDS
                value: "2"
            disk:
              name: relayforge-state
              mountPath: /srv/app/data
              sizeGB: 1

          - type: web
            name: farsipulse-site
            runtime: static
            buildCommand: "true"
            staticPublishPath: ./projects/persian-sentiment-api/site
            autoDeployTrigger: off
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Frame-Options
                value: DENY

          - type: web
            name: atlasrag-site
            runtime: static
            buildCommand: "true"
            staticPublishPath: ./projects/production-rag-service/site
            autoDeployTrigger: off
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Frame-Options
                value: DENY

          - type: web
            name: relayforge-site
            runtime: static
            buildCommand: "true"
            staticPublishPath: ./projects/webhook-reliability-platform/site
            autoDeployTrigger: off
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Frame-Options
                value: DENY

        databases:
          - name: atlasrag-postgres
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: 16
            databaseName: atlasrag
            user: atlasrag
            diskSizeGB: 1
